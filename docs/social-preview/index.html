<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", sans-serif;
    color: #fff;
    background:
      radial-gradient(900px 500px at 85% 20%, rgba(124, 92, 255, 0.35), transparent 60%),
      radial-gradient(700px 500px at 10% 110%, rgba(10, 132, 255, 0.30), transparent 60%),
      linear-gradient(160deg, #0b1230 0%, #1a1446 55%, #2a1a5e 100%);
    position: relative;
  }
  .left { position: absolute; left: 64px; top: 104px; width: 450px; }
  .icon { width: 120px; height: 120px; border-radius: 27px; overflow: hidden;
          box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .icon img { height: 148px; margin: -14px 0 0 -15px; } /* first (light) variant of the strip */
  h1 { font-size: 66px; font-weight: 700; letter-spacing: -0.03em; margin: 30px 0 14px; }
  p { font-size: 25px; line-height: 1.36; color: rgba(255,255,255,.78); margin: 0; letter-spacing: -0.01em; }
  .chips { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { font: 600 18px ui-rounded, "SF Pro Rounded", sans-serif; padding: 7px 16px; border-radius: 999px;
          background: rgba(255,255,255,.10); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 .5px rgba(255,255,255,.15); }
  .card { position: absolute; filter: drop-shadow(0 22px 36px rgba(0,0,0,.55)); }
  .card img { display: block; }
  /* Left column: CPU and memory, then disk; right column: Claude, then the NAS. Every image is 2x, with ~12 pt of
     transparent margin around its card (room for the glass's shadow in the panel). */
  .sys { left: 522px; top: 186px; width: 372px; }
  .sys img { width: 372px; }
  /* The disk card's footer ("Updated … · partial scan" note) is clipped off under the legend, corners redrawn. Clip on
     the image, so the wrapper's shadow follows the new edge. */
  .disk { left: 522px; top: 296px; width: 372px; }
  .disk img { width: 372px; clip-path: inset(0 10px 34px 10px round 0 0 23px 23px); }
  .claude { left: 892px; top: 112px; width: 372px; }
  .claude img { width: 372px; }
  .nas { left: 892px; top: 288px; width: 372px; }
  .nas img { width: 372px; }
</style>
</head>
<body>
  <div class="left">
    <div class="icon"><img src="../images/app-icon.png" alt=""></div>
    <h1>SoHo Monitor</h1>
    <p>A native macOS monitor for the small office: disk, CPU &amp; memory, Claude plan usage and the Synology NAS, in a Liquid&nbsp;Glass desktop panel.</p>
    <div class="chips"><span class="chip">SwiftUI</span><span class="chip">macOS 26</span><span class="chip">open source</span></div>
  </div>
  <div class="card sys"><img src="../images/system-cards.png" alt=""></div>
  <div class="card disk"><img src="../images/disk-card.png" alt=""></div>
  <div class="card claude"><img src="../images/claude-card.png" alt=""></div>
  <div class="card nas"><img src="../images/nas-card.png" alt=""></div>
</body>
</html>
