<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", sans-serif;
    color: #fff;
    background:
      radial-gradient(900px 500px at 85% 20%, rgba(124, 92, 255, 0.35), transparent 60%),
      radial-gradient(700px 500px at 10% 110%, rgba(10, 132, 255, 0.30), transparent 60%),
      linear-gradient(160deg, #0b1230 0%, #1a1446 55%, #2a1a5e 100%);
    position: relative;
  }
  .left { position: absolute; left: 80px; top: 112px; width: 520px; }
  .icon { width: 132px; height: 132px; border-radius: 30px; overflow: hidden;
          box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .icon img { height: 163px; margin: -15px 0 0 -16px; } /* first (light) variant of the strip */
  h1 { font-size: 72px; font-weight: 700; letter-spacing: -0.03em; margin: 34px 0 14px; }
  p { font-size: 27px; line-height: 1.35; color: rgba(255,255,255,.78); margin: 0; letter-spacing: -0.01em; }
  .chips { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { font: 600 18px ui-rounded, "SF Pro Rounded", sans-serif; padding: 7px 16px; border-radius: 999px;
          background: rgba(255,255,255,.10); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 .5px rgba(255,255,255,.15); }
  .card { position: absolute; filter: drop-shadow(0 22px 36px rgba(0,0,0,.55)); }
  .card img { display: block; }
  .sys { left: 640px; top: 34px; width: 400px; }
  .sys img { width: 400px; }
  .disk { left: 640px; top: 222px; width: 400px; height: 212px; overflow: hidden;
          clip-path: inset(11px 11px 0 11px round 20px); }
  .disk img { width: 400px; }
  .claude { left: 862px; top: 262px; width: 380px; }
  .claude img { width: 380px; }
</style>
</head>
<body>
  <div class="left">
    <div class="icon"><img src="../images/app-icon.png" alt=""></div>
    <h1>SoHo Monitor</h1>
    <p>A native macOS monitor for the small office: disk, CPU &amp; memory, and Claude plan usage, in a Liquid&nbsp;Glass desktop panel.</p>
    <div class="chips"><span class="chip">SwiftUI</span><span class="chip">macOS 26</span><span class="chip">open source</span></div>
  </div>
  <div class="card sys"><img src="../images/system-cards.png" alt=""></div>
  <div class="card disk"><img src="disk-source.png" alt=""></div>
  <div class="card claude"><img src="../images/claude-card.png" alt=""></div>
</body>
</html>
