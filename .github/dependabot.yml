version: 2
updates:
  # Actions are pinned by SHA with the tag as a comment: Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Swift packages (Package.swift / Package.resolved).
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Node helper of the Claude card: the Agent SDK is pinned exactly (docs/adr/0001-claude-usage-source.md); check
  # the card before merging a bump (its usage method is experimental).
  - package-ecosystem: npm
    directory: /Helpers/claude-usage
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
