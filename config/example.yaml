# soho-monitor configuration example.
# Copy it to ~/.config/soho-monitor/config.yaml (or point $SOHO_MONITOR_CONFIG at your own file, e.g. one
# versioned in your dotfiles). The app watches the file and reloads it on save; an invalid file is reported in the
# panel and the menu, and the last valid configuration stays in use. Unknown keys are reported as warnings.

disk:
  # Minutes between two automatic scans (1 to 1440). A full pass reads every listed folder with `du` at low
  # priority and can take several minutes. "Rescan now" in the menu starts one at once.
  scan_interval_minutes: 30

  # Colour of the free-space pill: orange below warning_below_percent, red below critical_below_percent
  # (percent of the disk; critical must be lower than warning).
  free_space:
    warning_below_percent: 20
    critical_below_percent: 10

  # Categories, measured in this order. Each one has:
  #   group   colour in the bar and chip in the legend; several categories can share a group
  #   label   line in the group's detail (defaults to the group's name)
  #   paths   folders or files; `~` and globs (`*`, `?`, `[...]`) allowed; quote a path that starts with `*`, `&`,
  #           `!`, `[` or `{` (YAML syntax), spaces need no quotes
  #   source  instead of paths: `ios-runtimes` (iOS simulator runtimes, stored outside the home folder, size
  #           reported by `xcrun simctl runtime list -j`)
  #
  # A path counted by an EARLIER category is subtracted from the paths that contain it: list the most specific
  # first (DerivedData before ~/Library/Developer). A path inside one already counted adds nothing.
  # "macOS" (the non-Data volumes of the startup container) and "Other" (used − macOS − everything counted) are
  # computed by the app: these two group names are reserved.
  # Without Full Disk Access for the app, protected folders (Mail, Messages, other apps' containers) are measured
  # partially: their chip shows ⚠︎.
  categories:
    - group: Dev
      label: Test simulators
      paths: [~/Library/Developer/XCTestDevices]

    - group: Dev
      label: Simulators
      paths: [~/Library/Developer/CoreSimulator]

    - group: Dev
      label: iOS runtimes
      source: ios-runtimes

    - group: Dev
      label: DerivedData
      paths: [~/Library/Developer/Xcode/DerivedData]

    - group: Dev
      label: Xcode other
      paths: [~/Library/Developer]

    - group: Dev
      label: Agent work
      paths: [~/agent-work]

    - group: Dev
      label: Git repos
      paths: [~/Git]

    - group: Dev
      label: Homebrew
      paths:
        - /opt/homebrew
        - ~/Library/Caches/Homebrew

    - group: Dev
      label: Tool caches
      paths:
        - ~/.cache
        - ~/.npm
        - ~/.cargo
        - ~/.gradle
        - ~/.m2
        - ~/Library/Caches/CocoaPods
        - ~/Library/Caches/org.carthage.CarthageKit

    - group: Cloud
      label: Dropbox
      paths: [~/Library/CloudStorage/Dropbox*]

    - group: Cloud
      label: iCloud Drive
      paths: [~/Library/Mobile Documents]

    - group: Cloud
      label: Other cloud
      paths: [~/Library/CloudStorage]

    - group: Photos
      paths: [~/Pictures]

    - group: Documents
      paths:
        - ~/Documents
        - ~/Desktop
        - ~/Downloads

    - group: Mail & Messages
      paths:
        - ~/Library/Mail
        - ~/Library/Messages

    - group: Applications
      paths:
        - /Applications
        - ~/Applications

    - group: App data
      label: Claude
      paths: [~/Library/Application Support/Claude]

    - group: App data
      label: Other apps
      paths:
        - ~/Library/Application Support
        - ~/Library/Containers
        - ~/Library/Group Containers

    - group: Caches
      paths: [~/Library/Caches]

# Claude plan usage (optional: without this section, or with no account, the Claude card is off).
# One block per Claude Code profile, in this order: a bar with the weekly limit (all models), then one line (ring,
# percent, reset) per 5-hour session and per-model weekly limit. Figures come from Claude Code itself through a
# helper bundled with the app (docs/adr/0001-claude-usage-source.md): it needs Node.js 18.14+ and Claude Code installed, and each profile
# logged in once (`CLAUDE_CONFIG_DIR=<config_dir> claude`, then /login). No prompt is sent, nothing is spent.
claude:
  # Minutes between two refreshes (1 to 1440), only while the desktop panel is shown; showing the panel refreshes at
  # once each profile last tried at least this long ago.
  refresh_minutes: 5
  # label        name shown in the card (unique)
  # config_dir   the profile's CLAUDE_CONFIG_DIR (`~` allowed); a missing directory is a warning, and the card
  #              says so (the app never creates it)
  accounts:
    - label: Work
      config_dir: ~/.claude-work
    - label: Personal
      config_dir: ~/.claude-personal

# Synology NAS (optional: without this section the NAS card is off). Read-only client of the DSM Web API, over HTTPS
# only. The card offers "Set Up…" (also in the menu: Synology Credentials…) to type the password, test the
# connection and save it in the macOS Keychain; it is never written in this file.
synology:
  # Host name or IP address of the NAS, nothing else (no https://, no port, no path).
  host: nas.example.lan
  # DSM HTTPS port (DSM default 5001). Plain HTTP is never used: the password would travel in clear.
  port: 5001
  # A dedicated DSM account for the monitor: read-only, no 2-factor authentication (an unattended app cannot
  # answer an OTP), ideally allowed from the LAN only. Create it in DSM › Control Panel › User & Group.
  user: <user>
  # Name of the Keychain item that holds its password: service "soho-monitor", account = this name (default
  # "synology"). Saved by the app, or from a shell (the command asks for the password; nothing is echoed):
  #   security add-generic-password -s soho-monitor -a synology -T "$HOME/Applications/SohoMonitor.app" -w
  # (-T lets the app read it without a prompt; without it macOS asks once: choose Always Allow. "Test" on the NAS
  # card, or Test Saved Password in the credential window, reads it and logs in, which brings that prompt.)
  keychain_item: synology
  # Seconds between two refreshes of the NAS card, at least 60 (polling floor for a small NAS). The card is refreshed
  # only while the desktop panel is shown, with one login kept from one refresh to the next. After failures the wait
  # doubles up to 10 minutes; a refused login stops polling until the password or this section changes.
  interval_seconds: 60
  # Parts of the card, each with its own DSM calls (default: all four). Remove one to stop its calls:
  #   storage  volume usage and health, storage pool and disk health (SYNO.Storage.CGI.Storage)
  #   system   CPU, RAM, disk activity, model, DSM version, temperature, uptime (SYNO.Core.System[.Utilization])
  #   update   "Update: DSM x.y" badge when DSM has an update (SYNO.Core.Upgrade.Server, read-only check)
  #   docker   containers with a status dot (SYNO.Docker.Container; hidden when the package is not installed)
  sections: [storage, system, update, docker]
  # Containers that are stopped on purpose (jobs started by hand): shown with a grey dot, not flagged.
  expected_stopped: []
  # Hours between two DSM update checks, 1 to 168 (default 6): the check makes the NAS contact Synology's servers.
  update_interval_hours: 6
  # How the NAS's certificate is trusted. Without `tls:`, the system's trust store decides: a certificate from a
  # public authority, valid and matching `host`. Otherwise, exactly one of:
  #   pin_sha256         trust only this certificate, by the SHA-256 fingerprint of its leaf (64 hex digits, `:`
  #                      allowed), even self-signed or expired. An expired pinned certificate still works and the card
  #                      shows "certificate expired, pinned"; any other certificate is refused ("pinned certificate
  #                      changed", with the new fingerprint: check it in DSM before pinning it). To read the
  #                      fingerprint: Set Up… shows the one presented when trust fails, or
  #                        openssl s_client -connect <host>:5001 </dev/null | openssl x509 -noout -fingerprint -sha256
  #                      then compare it with DSM › Control Panel › Security › Certificate.
  #   allow_self_signed  true: accept ANY certificate. Still encrypted, but anyone on the LAN can impersonate the NAS
  #                      and receive the password; the card shows a permanent warning. Prefer pin_sha256.
  # An expired certificate without a pin is refused: "certificate expired; renew it in DSM or pin its fingerprint".
  # tls:
  #   pin_sha256: "AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89"
  #   # or
  #   allow_self_signed: true
